name: Customer Churn Build pipeline - MLOps

on:
  workflow_dispatch:

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run src/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run src/model_building/prep.py


  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Start MLflow server (background)
        run: |
          nohup uv run mlflow server \
            --host 127.0.0.1 --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root file:///tmp/mlruns >/tmp/mlflow.log 2>&1 &
          sleep 1
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5000/ >/dev/null && break
            echo "Waiting for MLflow server..."
            sleep 2
          done
      - name: Show MLflow logs (tail)
        run: |
          echo "=== MLflow log tail ==="
          tail -n 200 /tmp/mlflow.log || true
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run src/model_building/train.py